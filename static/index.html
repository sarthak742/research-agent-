<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a0f; --surface: #14141f; --surface-hover: #1a1a28;
            --primary: #7c3aed; --primary-glow: rgba(124,58,237,.3);
            --secondary: #06b6d4; --text: #e2e8f0; --text-muted: #64748b;
            --success: #10b981; --error: #ef4444;
            --thinking:#a78bfa; --planning:#818cf8; --searching:#06b6d4;
            --reading:#34d399; --reflecting:#fbbf24; --writing:#fb923c;
        }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }
        h1,h2,h3 { font-family:'Syne',sans-serif; }
        .container { display:flex; min-height:100vh; }
        .left-panel { width:40%; padding:2rem; background:var(--surface); border-right:1px solid rgba(255,255,255,.05); display:flex; flex-direction:column; gap:2rem; }
        .logo { display:flex; align-items:center; gap:.75rem; }
        .logo-icon { width:48px; height:48px; background:linear-gradient(135deg,var(--primary),var(--secondary)); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
        .logo h1 { font-size:1.5rem; background:linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .input-group { display:flex; flex-direction:column; gap:.5rem; }
        .input-group label { font-size:.875rem; color:var(--text-muted); font-weight:500; }
        .input-group input { padding:.875rem 1rem; background:var(--bg); border:1px solid rgba(255,255,255,.1); border-radius:8px; color:var(--text); font-size:1rem; font-family:'Inter',sans-serif; }
        .input-group input:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-glow); }
        .depth-selector { display:flex; gap:.5rem; }
        .depth-btn { flex:1; padding:.75rem; background:var(--bg); border:1px solid rgba(255,255,255,.1); border-radius:8px; color:var(--text-muted); cursor:pointer; font-family:'Inter',sans-serif; font-size:.875rem; }
        .depth-btn.active { background:var(--primary); border-color:var(--primary); color:#fff; }
        .start-btn { padding:1rem 2rem; background:linear-gradient(135deg,var(--primary),#6d28d9); border:none; border-radius:8px; color:#fff; font-size:1rem; font-weight:600; cursor:pointer; font-family:'Syne',sans-serif; }
        .start-btn:disabled { opacity:.6; cursor:not-allowed; }
        .right-panel { width:60%; padding:2rem; overflow-y:auto; display:flex; flex-direction:column; gap:1.5rem; }
        .section-title { font-size:1.125rem; color:var(--text-muted); }
        .activity-feed { display:flex; flex-direction:column; gap:.75rem; }
        .activity-card { display:flex; align-items:flex-start; gap:1rem; padding:1rem 1.25rem; background:var(--surface); border-radius:12px; animation:slideIn .3s ease-out; border-left:3px solid var(--primary); }
        .activity-card.thinking{border-left-color:var(--thinking)} .activity-card.planning{border-left-color:var(--planning)}
        .activity-card.searching{border-left-color:var(--searching)} .activity-card.reading{border-left-color:var(--reading)}
        .activity-card.reflecting{border-left-color:var(--reflecting)} .activity-card.writing{border-left-color:var(--writing)}
        .activity-card.done{border-left-color:var(--success)} .activity-card.error{border-left-color:var(--error)}
        .activity-icon { font-size:1.25rem; flex-shrink:0; }
        .activity-message { font-size:.9375rem; line-height:1.5; }
        .activity-time { font-size:.75rem; color:var(--text-muted); margin-top:.25rem; }
        @keyframes slideIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
        .report-container { background:var(--surface); border-radius:12px; padding:1.5rem; display:none; }
        .report-container.visible { display:block; }
        .report-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid rgba(255,255,255,.1); }
        .download-btn { padding:.5rem 1rem; background:var(--secondary); border:none; border-radius:6px; color:var(--bg); font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
        .report-content { line-height:1.7; }
        .report-content h2 { margin:1.5rem 0 .75rem; font-size:1.375rem; }
        .report-content p, .report-content li { margin-bottom:.5rem; }
        .report-content ul { padding-left:1.5rem; }
        .report-content a { color:var(--secondary); text-decoration:none; }
        .empty-state { text-align:center; padding:4rem 2rem; color:var(--text-muted); }
        .empty-state-icon { font-size:4rem; margin-bottom:1rem; opacity:.5; }
        @media (max-width:768px){ .container{flex-direction:column} .left-panel,.right-panel{width:100%} }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div class="logo"><div class="logo-icon">🔬</div><h1>Research Agent</h1></div>
            <div class="input-group">
                <label>Research Topic</label>
                <input type="text" id="topic" placeholder="Enter topic to research..." />
            </div>
            <div class="input-group">
                <label>Research Depth</label>
                <div class="depth-selector">
                    <button class="depth-btn active" data-depth="basic">Basic</button>
                    <button class="depth-btn" data-depth="detailed">Detailed</button>
                </div>
            </div>
            <button class="start-btn" id="startBtn">Start Research</button>
        </div>
        <div class="right-panel">
            <div class="section-title">Activity Feed</div>
            <div class="activity-feed" id="activityFeed">
                <div class="empty-state"><div class="empty-state-icon">🧠</div><p>Enter a topic and click Start Research</p></div>
            </div>
            <div class="report-container" id="reportContainer">
                <div class="report-header"><h2>Research Report</h2><button class="download-btn" id="downloadBtn">Download .md</button></div>
                <div class="report-content" id="reportContent"></div>
            </div>
        </div>
    </div>

    <script>
        let currentTopic = '', currentDepth = 'basic';
        let reportBuffer = '', evtSource = null;

        const topicInput = document.getElementById('topic');
        const startBtn = document.getElementById('startBtn');
        const activityFeed = document.getElementById('activityFeed');
        const reportContainer = document.getElementById('reportContainer');
        const reportContentEl = document.getElementById('reportContent');
        const downloadBtn = document.getElementById('downloadBtn');

        document.querySelectorAll('.depth-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.depth-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentDepth = btn.dataset.depth;
            });
        });

        const icons = { thinking:'🧠', planning:'🗺️', searching:'🔍', reading:'📖',
                        reflecting:'🤔', writing:'✍️', done:'✅', error:'⚠️' };

        function addActivity(type, message) {
            const empty = activityFeed.querySelector('.empty-state');
            if (empty) empty.remove();
            const card = document.createElement('div');
            card.className = `activity-card ${type}`;
            card.innerHTML = `<span class="activity-icon">${icons[type]||'•'}</span>
                <div class="activity-content"><div class="activity-message"></div>
                <div class="activity-time">${new Date().toLocaleTimeString()}</div></div>`;
            card.querySelector('.activity-message').textContent = message; // textContent = no XSS
            activityFeed.appendChild(card);
            activityFeed.scrollTop = activityFeed.scrollHeight;
        }

        function finish() {
            if (evtSource) { evtSource.close(); evtSource = null; }
            startBtn.disabled = false;
            startBtn.textContent = 'Start Research';
        }

        startBtn.addEventListener('click', async () => {
            const topic = topicInput.value.trim();
            if (!topic) { topicInput.focus(); return; }
            currentTopic = topic;
            startBtn.disabled = true;
            startBtn.textContent = 'Researching...';
            activityFeed.innerHTML = '';
            reportContainer.classList.remove('visible');
            reportBuffer = '';
            reportContentEl.innerHTML = '';

            let researchId;
            try {
                const res = await fetch('/research', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ topic, depth: currentDepth })
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `Request failed (${res.status})`);
                }
                researchId = (await res.json()).research_id;
            } catch (err) {
                addActivity('error', 'Could not start research: ' + err.message);
                finish();
                return;
            }

            // Real Server-Sent Events: the browser's EventSource handles the
            // text/event-stream protocol, reconnection and parsing for us.
            evtSource = new EventSource(`/stream/${researchId}`);
            evtSource.onmessage = (e) => {
                let event;
                try { event = JSON.parse(e.data); } catch { return; }

                if (event.type === 'token') {
                    // Stream the report as it is written.
                    reportBuffer += event.message;
                    reportContainer.classList.add('visible');
                    reportContentEl.innerHTML = marked.parse(reportBuffer);
                    return;
                }

                addActivity(event.type, event.message);

                if (event.type === 'done') {
                    if (event.report) {
                        reportBuffer = event.report;
                        reportContentEl.innerHTML = marked.parse(reportBuffer);
                        reportContainer.classList.add('visible');
                    }
                    finish();
                } else if (event.type === 'error') {
                    finish();
                }
            };
            evtSource.onerror = () => {
                // EventSource fires onerror on normal stream close too; only
                // surface it if we never completed.
                if (evtSource && evtSource.readyState === EventSource.CLOSED) finish();
            };
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([reportBuffer], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentTopic.replace(/[^a-z0-9]/gi,'_')}_research.md`;
            a.click();
            URL.revokeObjectURL(url);
        });
    </script>
</body>
</html>
